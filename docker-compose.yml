services:
  postgres:
    image: postgres:16-alpine
    container_name: flashtalk-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: flashtalk
      POSTGRES_PASSWORD: flashtalk
      POSTGRES_DB: flashtalk
    volumes:
      - flashtalk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashtalk -d flashtalk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  flashtalk_pg_data:
